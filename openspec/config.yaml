schema: spec-driven
context: |
  Ring Rivals is an original online-only 1v1 boxing game built in React, Vite,
  and Babylon Lite, targeting WebGPU browsers and GitHub Pages. The repo root
  is the npm root; ring-rivals/ is the Vite app.
  Preserve template four-corner UI roles, version.txt, protected links,
  fullscreen persistence, and Pixel Perfect rendering constraints. The chosen
  game view is fixed landscape 16:9 with no orientation toggle, shortcut, or
  persisted override. Replace the Babylon showcase with gameplay. Babylon Lite
  is WebGPU-only; show a clear unsupported-browser error and do not add a
  fallback renderer. This 2D game uses Pixel Perfect rendering and chooses its
  own logical resolution and render scale. Audio is optional; this game uses
  six original event sound effects, a mute control, and ?mute=1, with no music.
  Combat, match progression, and reconnect authority belong to the shared
  Colyseus service; browser clients render server state and send validated
  inputs. Online private invite rooms only; no local play, couch co-op, bots,
  quick-match, accounts, or persistent history. Use original art and audio.
  Root commands are npm ci, npm run dev, npm test, npm run build. Keep app
  content under the renamed application folder and document assets there.
  Do not create a pull request unless explicitly requested.
rules:
  proposal:
    - Mark unresolved decisions clearly; recommendations are not approvals.
    - State the affected user behavior and acceptance criteria.
  design:
    - Describe only architecture and technologies verified for this project.
    - Preserve explicit boundaries between application layers or packages.
  tasks:
    - Keep planning, implementation, and verification tasks explicit.
    - Include focused checks appropriate to the implemented change.

